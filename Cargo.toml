# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["tests/consumer"]
default-members = ["."]
resolver = "3"

[package]
name = "jq"
version = "0.3.1"
authors = ["Arto Bendiken"]
edition = "2024"
rust-version = "1.97"
description = "jq.rs transforms JSON using the jq language"
#documentation = "https://docs.rs/jq"
readme = true
homepage = "https://github.com/dryrust/jq.rs"
repository = "https://github.com/dryrust/jq.rs"
license = "Unlicense"
keywords = ["jq", "json", "filter"]
categories = [
    "command-line-utilities",
    "template-engine",
    "encoding",
    "compilers",
    "parser-implementations",
]
publish = true

[features]
default = ["all", "std"]
all = ["jaq", "jq"]
std = [
    "jaq-core?/std", "jaq-json?/std", "jaq-std?/std",
    "jaq-std?/format", "jaq-std?/log", "jaq-std?/math",
    "jaq-std?/regex", "jaq-std?/time", "serde_json?/std", "thiserror?/std",
]
# Reserved for experimental APIs; currently has no effect.
unstable = []
# Exposes host environment variables to programs; unsafe for untrusted input.
env = ["std"]
# Lets jq programs load modules and data files; unsafe for untrusted input.
import = []
# Forwards jaq's `stderr` and `debug` messages to the `log` crate.
log = ["std"]
# Runs jaq on a large stack, so deep programs and values do not abort.
stacker = ["std", "dep:stacker"]

jaq = ["_api", "dep:jaq-core", "dep:jaq-json", "dep:jaq-std", "dep:serde"]
# Upstream jq subprocess backend; jaq takes precedence when both are enabled.
jq = ["_api", "std"]
# Reserved, unimplemented backend flags.
libjq = []
xq = []

# Shared filtering API dependencies; enabled by implemented backends.
_api = ["dep:serde_json", "dep:thiserror"]

# Select the jq backend, so that its backend-specific items appear too. The
# nightly `doc_cfg` feature labels every feature-gated item with its features.
[package.metadata.docs.rs]
no-default-features = true
features = ["jq"]
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "filter"
harness = false
required-features = ["jaq", "std"]

[dependencies]
jaq-core = { version = "3.1.1", default-features = false, optional = true }
jaq-json = { version = "2.0.3", default-features = false, optional = true }
jaq-std = { version = "3.0.3", default-features = false, optional = true }
serde = { version = "1", default-features = false, optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }
stacker = { version = "0.1.25", optional = true }
thiserror = { version = "2", default-features = false, optional = true }

[dev-dependencies]
log = { version = "0.4", default-features = false }
