# See: https://docs.github.com/en/actions/writing-workflows
---
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  arithmetic:
    name: Arithmetic (${{ matrix.target }}, ${{ matrix.profile.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, wasm32-wasip1]
        profile:
          - name: debug
            args: ""
          - name: release
            args: --release
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: node .github/scripts/wasi-runner.mjs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install WASI runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run arithmetic regressions
        run: >-
          cargo test --locked --no-default-features --features jaq
          --test arithmetic --target ${{ matrix.target }}
          ${{ matrix.profile.args }} -- --test-threads=1
  bare-metal:
    name: Bare-metal consumer (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.97.0", stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: thumbv7em-none-eabihf
      - name: Check functional no-std consumer
        run: >-
          cargo check --locked -p jq-consumer-tests --lib
          --no-default-features --features jaq --target thumbv7em-none-eabihf
  upstream-jq:
    name: Upstream jq (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.97.0", stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install upstream jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Report jq version
        run: jq --version
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - name: Run tests and doctests
        run: cargo test --locked --no-default-features --features jq
      - name: Run consumer contracts
        run: >-
          cargo test --locked -p jq-consumer-tests --no-default-features
          --features jq
      - name: Check subprocess adapter
        run: >-
          cargo clippy --locked --all-targets --no-default-features
          --features jq -- -D warnings
      - name: Check subprocess documentation
        run: cargo doc --locked --no-default-features --features jq --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  check-32-bit:
    name: Check 32-bit jaq backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check backend and integration tests
        run: >-
          cargo check --locked --tests --target wasm32-unknown-unknown
          --no-default-features --features jaq
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check documentation
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  build-ubuntu:
    name: Ubuntu (${{ matrix.rust }}, ${{ matrix.features.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.97.0", stable]
        features:
          - name: default
            args: ""
          - name: all
            args: --all-features
          - name: none
            args: --no-default-features
          - name: jaq
            args: --no-default-features --features jaq
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Build
        run: cargo build --locked ${{ matrix.features.args }}
      - name: Build examples
        run: cargo build --locked --examples ${{ matrix.features.args }}
      - name: Run tests and doctests
        run: cargo test --locked ${{ matrix.features.args }}
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked
      - name: Build examples
        run: cargo build --locked --examples
      - name: Run tests
        run: cargo test --locked
  consumer-features:
    name: Consumer (${{ matrix.rust }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.97.0", stable]
        features:
          - jaq
          - jaq,arbitrary_precision
          - jaq,preserve_order
          - jaq,arbitrary_precision,preserve_order
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Test consumer feature unification
        run: >-
          cargo test --locked -p jq-consumer-tests --no-default-features
          --features ${{ matrix.features }}
